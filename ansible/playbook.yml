---
- name: Deploy NairobiPulse
  hosts: app
  become: true
  gather_facts: true

  vars:
    app_name: nairobipulse
    app_image: nairobipulse
    app_tag: latest
    container_port: 8000
    host_port: 8000
    src_dir: "{{ playbook_dir }}/.."

  tasks:
    - name: Show facts gathered from the target
      ansible.builtin.debug:
        msg: >-
          Host {{ ansible_facts['hostname'] }} runs
          {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}
          ({{ ansible_facts['os_family'] }}), kernel
          {{ ansible_facts['kernel'] }}

    - name: Make sure this is a Debian-family host (uses facts)
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
        fail_msg: "This playbook only supports Debian/Ubuntu hosts."

    - name: Install Docker and the Python Docker SDK
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-docker
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Build the NairobiPulse image from the repo Dockerfile
      community.docker.docker_image:
        name: "{{ app_image }}"
        tag: "{{ app_tag }}"
        source: build
        build:
          path: "{{ src_dir }}"

    - name: Run the NairobiPulse container
      community.docker.docker_container:
        name: "{{ app_name }}"
        image: "{{ app_image }}:{{ app_tag }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ host_port }}:{{ container_port }}"

    - name: Check the health endpoint returns 200
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ host_port }}/health/"
        status_code: 200
        return_content: true
      register: health
      retries: 10
      delay: 3
      until: health.status == 200

    - name: Show health response
      ansible.builtin.debug:
        var: health.content
